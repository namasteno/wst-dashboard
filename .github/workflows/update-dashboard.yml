name: Update WST Dashboard

on:
  push:
    paths:
      - "incoming/report.pdf"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pdfplumber numpy

      - name: Parse report PDF
        run: |
          if [ -f "incoming/report.pdf" ]; then
            python scripts/parse_report.py incoming/report.pdf docs/data/daily.json
          else
            echo "No incoming/report.pdf found — nothing to parse."
            exit 1
          fi

      - name: Refit models and generate projections
        run: python scripts/update_models.py docs/data/daily.json docs/data/model_output.json

      - name: Commit updated dashboard data
        run: |
          git config user.name "wst-dashboard-bot"
          git config user.email "actions@github.com"
          git add docs/data/daily.json docs/data/model_output.json
          git diff --cached --quiet || git commit -m "Update dashboard data: $(date -u +%Y-%m-%d)"
          git push
